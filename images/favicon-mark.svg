<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Izhar Foster">
  <!-- Corporate blue rounded square. #084595 is sampled from the wordmark
       embedded in images/logo.svg — keep the two in step if the logo changes. -->
  <rect width="32" height="32" rx="6" fill="#084595"/>

  <!-- Simplified compressor mark: two cylinders + crankcase, white silhouette.
       White on blue holds its contrast down to 16px; the previous green on
       navy did not. Centred at (16, 17). Total mark: ~22w × 18h. -->
  <g fill="#FFFFFF">
    <!-- Crankcase (bottom block) -->
    <rect x="5" y="17" width="22" height="7" rx="1.2"/>
    <!-- Baseplate -->
    <rect x="3.5" y="24" width="25" height="2.4" rx="0.6"/>
    <!-- Left cylinder -->
    <rect x="7" y="8" width="7" height="10" rx="1.2"/>
    <!-- Right cylinder -->
    <rect x="18" y="8" width="7" height="10" rx="1.2"/>
    <!-- Manifold across cylinder tops -->
    <rect x="6" y="6" width="20" height="2.5" rx="0.6"/>
  </g>
</svg>
